name: Quality Gate

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

jobs:
  # 快速检查（2分钟内反馈）
  quick-check:
    name: Quick Check (Lint + Quick Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.55
          args: --timeout=5m --out-format=colored-line-number

      - name: Quick Test (skip integration)
        run: go test -v -short ./...

  # 完整检查（PR 合并前）
  full-check:
    name: Full Check (Race + Coverage)
    runs-on: ubuntu-latest
    needs: quick-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Tests with Coverage
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate Coverage Report
        run: |
          echo "📊 Coverage Summary:"
          go tool cover -func=coverage.out | grep total

      - name: Check Coverage Threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "当前覆盖率: ${COVERAGE}%"

          # 第一阶段：警告模式（Week 1-3）
          if (( $(echo "$COVERAGE < 20" | bc -l) )); then
            echo "⚠️ 覆盖率低于 20%，建议增加测试"
          elif (( $(echo "$COVERAGE >= 20" | bc -l) )) && (( $(echo "$COVERAGE < 50" | bc -l) )); then
            echo "✅ 覆盖率 ${COVERAGE}% 已达标（目标：50%）"
          else
            echo "🎉 覆盖率 ${COVERAGE}% 优秀！"
          fi

          # 第二阶段（Week 4+）：启用强制模式
          # 取消下面的注释以启用强制覆盖率检查
          # if (( $(echo "$COVERAGE < 50" | bc -l) )); then
          #   echo "❌ 覆盖率低于 50%，禁止合并"
          #   exit 1
          # fi

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  # 构建验证
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: quick-check

    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME=ytb2bili-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          fi
          go build -v -ldflags="-s -w" -o $BINARY_NAME .
          echo "✅ Build successful: $BINARY_NAME"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ytb2bili-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ytb2bili*
          retention-days: 7
