<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT 认证测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        .test-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            background: white;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }

        .test-name {
            flex: 1;
            font-size: 14px;
            color: #333;
        }

        .status {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
        }

        .status.pass {
            background: #d4edda;
            color: #155724;
        }

        .status.fail {
            background: #f8d7da;
            color: #721c24;
        }

        .status.pending {
            background: #fff3cd;
            color: #856404;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .token-info {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            margin-bottom: 15px;
            color: #004085;
        }

        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .log-entry {
            margin-bottom: 8px;
        }

        .log.success {
            color: #4ec9b0;
        }

        .log.error {
            color: #f48771;
        }

        .log.info {
            color: #569cd6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 JWT 认证测试工具</h1>
        <p class="subtitle">用于测试前端 JWT 认证是否正常工作</p>

        <div class="section">
            <div class="section-title">当前 Token 信息</div>
            <div id="tokenInfo" class="token-info">未登录</div>
            <button id="loginBtn" onclick="testLogin()">登录 (mei/123456)</button>
            <button onclick="clearToken()">清除 Token</button>
        </div>

        <div class="section">
            <div class="section-title">API 测试</div>
            <button onclick="runAllTests()">运行所有测试</button>
            <div style="margin-top: 15px;">
                <div class="test-item">
                    <div class="test-name">1. 获取配置 (GET /api/v1/config/download)</div>
                    <div id="test1" class="status pending">待测试</div>
                </div>
                <div class="test-item">
                    <div class="test-name">2. 更新配置 (PUT /api/v1/config/download)</div>
                    <div id="test2" class="status pending">待测试</div>
                </div>
                <div class="test-item">
                    <div class="test-name">3. 获取 OpenAI 配置</div>
                    <div id="test3" class="status pending">待测试</div>
                </div>
                <div class="test-item">
                    <div class="test-name">4. 获取 Gemini 配置</div>
                    <div id="test4" class="status pending">待测试</div>
                </div>
                <div class="test-item">
                    <div class="test-name">5. 获取账号列表</div>
                    <div id="test5" class="status pending">待测试</div>
                </div>
                <div class="test-item">
                    <div class="test-name">6. 获取用户信息 (GET /api/v1/user/me)</div>
                    <div id="test6" class="status pending">待测试</div>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">测试日志</div>
            <div id="log" class="log"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8096/api/v1';

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateTestStatus(id, passed, message) {
            const el = document.getElementById(id);
            el.className = `status ${passed ? 'pass' : 'fail'}`;
            el.textContent = passed ? '✅ PASS' : '❌ FAIL';
            if (message) {
                el.textContent += ` - ${message}`;
            }
        }

        function updateTokenInfo() {
            const token = localStorage.getItem('jwt_token');
            const user = localStorage.getItem('jwt_user');
            const tokenInfo = document.getElementById('tokenInfo');

            if (token) {
                let info = `Token: ${token.substring(0, 50)}...\n\n`;
                try {
                    const userData = JSON.parse(user);
                    info += `用户信息:\n`;
                    info += `  ID: ${userData.id}\n`;
                    info += `  用户名: ${userData.username}\n`;
                    info += `  角色: ${userData.role}\n`;
                    info += `  会员等级: ${userData.tier}\n`;
                } catch (e) {
                    info += `用户信息: ${user}`;
                }
                tokenInfo.textContent = info;
            } else {
                tokenInfo.textContent = '未登录';
            }
        }

        async function testLogin() {
            try {
                log('正在登录...', 'info');
                const response = await fetch(`${API_BASE}/user/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'mei',
                        password: '123456'
                    })
                });

                const data = await response.json();

                if (data.code === 0 && data.data) {
                    localStorage.setItem('jwt_token', data.data.token.access_token);
                    localStorage.setItem('jwt_refresh_token', data.data.token.refresh_token);
                    localStorage.setItem('jwt_user', JSON.stringify(data.data.user));
                    log('✅ 登录成功！', 'success');
                    updateTokenInfo();
                } else {
                    log(`❌ 登录失败: ${data.message}`, 'error');
                }
            } catch (error) {
                log(`❌ 登录错误: ${error.message}`, 'error');
            }
        }

        function clearToken() {
            localStorage.removeItem('jwt_token');
            localStorage.removeItem('jwt_refresh_token');
            localStorage.removeItem('jwt_user');
            log('Token 已清除', 'info');
            updateTokenInfo();
        }

        async function testApi(testName, method, endpoint, data = null) {
            try {
                const token = localStorage.getItem('jwt_token');
                if (!token) {
                    log(`❌ ${testName}: 未登录`, 'error');
                    return { success: false, message: '未登录' };
                }

                log(`正在测试: ${testName}`, 'info');

                const headers = {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                };

                const options = {
                    method,
                    headers
                };

                if (data) {
                    options.body = JSON.stringify(data);
                }

                const response = await fetch(`${API_BASE}${endpoint}`, options);
                const result = await response.json();

                if (response.ok && result.code === 200) {
                    log(`✅ ${testName}: 成功`, 'success');
                    return { success: true, data: result };
                } else {
                    log(`❌ ${testName}: 失败 (${response.status}) - ${result.message}`, 'error');
                    return { success: false, message: result.message };
                }
            } catch (error) {
                log(`❌ ${testName}: 错误 - ${error.message}`, 'error');
                return { success: false, message: error.message };
            }
        }

        async function runAllTests() {
            const token = localStorage.getItem('jwt_token');
            if (!token) {
                alert('请先登录！');
                return;
            }

            // 重置状态
            for (let i = 1; i <= 6; i++) {
                updateTestStatus(`test${i}`, false, '待测试');
            }

            log('========== 开始测试 ==========', 'info');

            // 测试 1: 获取配置
            const test1 = await testApi('获取配置', 'GET', '/config/download');
            updateTestStatus('test1', test1.success);

            // 测试 2: 更新配置
            const test2 = await testApi('更新配置', 'PUT', '/config/download', {
                auto_upload_enabled: true,
                video_upload_delay: 10
            });
            updateTestStatus('test2', test2.success);

            // 测试 3: 获取 OpenAI 配置
            const test3 = await testApi('获取 OpenAI 配置', 'GET', '/config/openai-compatible');
            updateTestStatus('test3', test3.success);

            // 测试 4: 获取 Gemini 配置
            const test4 = await testApi('获取 Gemini 配置', 'GET', '/config/gemini');
            updateTestStatus('test4', test4.success);

            // 测试 5: 获取账号列表
            const test5 = await testApi('获取账号列表', 'GET', '/auth/accounts');
            updateTestStatus('test5', test5.success);

            // 测试 6: 获取用户信息
            const test6 = await testApi('获取用户信息', 'GET', '/user/me');
            updateTestStatus('test6', test6.success);

            log('========== 测试完成 ==========', 'info');

            // 统计
            const tests = [test1, test2, test3, test4, test5, test6];
            const passed = tests.filter(t => t.success).length;
            log(`结果: ${passed}/${tests.length} 通过`, passed === tests.length ? 'success' : 'error');
        }

        // 页面加载时更新 Token 信息
        window.onload = updateTokenInfo;
    </script>
</body>
</html>
